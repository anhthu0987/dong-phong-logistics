[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dp_dispatch"
version = "0.1.0"
description = "Dong Phong fleet dispatch rules"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
dp_dispatch = ["*.txt"]
