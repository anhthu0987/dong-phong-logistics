services:
  configurator:
    image: logistics-erpnext:dispatch-v1
  backend:
    image: logistics-erpnext:dispatch-v1
  websocket:
    image: logistics-erpnext:dispatch-v1
  queue-short:
    image: logistics-erpnext:dispatch-v1
  queue-long:
    image: logistics-erpnext:dispatch-v1
  scheduler:
    image: logistics-erpnext:dispatch-v1
  frontend:
    image: logistics-erpnext:dispatch-v1
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      FRAPPE_SITE_NAME_HEADER: logistics.localhost
  db:
    image: mariadb:10.6
    environment:
      MARIADB_AUTO_UPGRADE: "0"
  redis-cache:
    image: redis:6.2-alpine
  redis-queue:
    image: redis:6.2-alpine
  gps-flusher:
    image: logistics-erpnext:dispatch-v1
    restart: unless-stopped
    working_dir: /home/frappe/frappe-bench
    command:
      - bash
      - -c
      - bench --site logistics.localhost execute dp_dispatch.dp_dispatch.api.gps_redis.run_flusher
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - db
      - redis-queue
