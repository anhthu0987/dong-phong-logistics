services:
  configurator:
    image: logistics-erpnext:dispatch-v16
  backend:
    image: logistics-erpnext:dispatch-v16
  websocket:
    image: logistics-erpnext:dispatch-v16
  queue-short:
    image: logistics-erpnext:dispatch-v16
  queue-long:
    image: logistics-erpnext:dispatch-v16
  scheduler:
    image: logistics-erpnext:dispatch-v16
  frontend:
    image: logistics-erpnext:dispatch-v16
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      FRAPPE_SITE_NAME_HEADER: logistics-v16.localhost
  db:
    image: mariadb:11.8
    environment:
      MARIADB_AUTO_UPGRADE: "0"
  redis-cache:
    image: redis:7-alpine
  redis-queue:
    image: redis:7-alpine
