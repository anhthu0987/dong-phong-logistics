services:
  configurator:
    image: logistics-erpnext:dispatch-v16
  backend:
    image: logistics-erpnext:dispatch-v16
  websocket:
    image: logistics-erpnext:dispatch-v16
  queue-short:
    image: logistics-erpnext:dispatch-v16
  queue-long:
    image: logistics-erpnext:dispatch-v16
  scheduler:
    image: logistics-erpnext:dispatch-v16
  gps-flusher:
    image: logistics-erpnext:dispatch-v16
    pull_policy: never
    restart: unless-stopped
    command: bench --site logistics-v16.localhost execute dp_dispatch.dp_dispatch.api.gps_redis.run_flusher
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
      backend:
        condition: service_started
  frontend:
    image: logistics-erpnext:dispatch-v16
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      FRAPPE_SITE_NAME_HEADER: logistics-v16.localhost
  db:
    image: mariadb:11.8
    environment:
      MARIADB_AUTO_UPGRADE: "0"
  redis-cache:
    image: redis:7-alpine
  redis-queue:
    image: redis:7-alpine
